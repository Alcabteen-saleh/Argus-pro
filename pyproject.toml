[project]
name = "argus-pro"
version = "2.0.0"
description = "Professional Security Analysis and Network Reconnaissance Platform"
authors = [{ name = "Manus Professional", email = "pro@manus.im" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.6",
    "PySide6>=6.5.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.8.4",
    "dnspython>=2.3.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.4",
    "plotly>=5.15.0",
]

[tool.setuptools]
packages = ["app", "core", "gui"]

[tool.black]
line-length = 100
target-version = ['py311']
